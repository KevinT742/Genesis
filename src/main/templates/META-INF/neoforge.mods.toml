# This is the neoforge.mods.toml file of the Genesis mod.
# It contains the data relating to the loading of the mod.

# The license you want the mod to be loaded under.
license="${mod_license}"

# A URL to refer people to when problems occur with this mod.
issueTrackerURL="https://github.com/genesis-mod/genesis/issues"

# A list of mods - how many allowed here is determined by the individual mod loader.
[[mods]] #mandatory

# The modid of the mod.
modId="${mod_id}" #mandatory

# The version number of the mod.
version="${mod_version}" #mandatory

# A display name for the mod.
displayName="${mod_name}" #mandatory

# The description text for the mod (multi line!) (#mandatory)
description='''
Genesis is the foundation of a family of mods that turns Minecraft into a planet.

It provides four things:

* A unified material template. Every block, vanilla or added by the family, is described by one
  profile that carries its physics, its chemistry and its magic. Mining speed, blast resistance,
  flammability and the way a block reacts to enchantments all follow from that single profile.

* A world generator that treats the world as a planet. The terrain is shaped by continentalness,
  erosion and mountain ridges, the water system routes real rainfall downhill and fills the
  hollows into lakes, and the ecosystems follow the latitude and the altitude.

* A structural system with three families of sites: settlements that are inhabited, ruins that are
  abandoned and hidden places that reward exploration. The settlements are connected by a road
  network that is planned across the whole planet.

* The architecture for further planets. A planet is described by a handful of numbers, so adding
  another one means writing a definition instead of a generator.
'''

# The authors of the mod, displayed in the mod UI (optional)
authors="Kevin742"

# An optional logo of the mod, shown in the mod list.
logoFile="genesis.png"

# A dependency on NeoForge itself.
[[dependencies.${mod_id}]] #mandatory
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="${neo_version}" #mandatory
    ordering="NONE"
    side="BOTH"

# A dependency on Minecraft itself.
[[dependencies.${mod_id}]] #mandatory
    modId="minecraft" #mandatory
    type="required" #mandatory
    versionRange="${minecraft_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"
